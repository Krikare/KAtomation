<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K{Atomation}</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">K{}</div>
          <div class="brand-copy">
            <h1 class="brand-title">K{Atomation}</h1>
            <p class="brand-subtitle">Universal Job Application Autofill</p>
          </div>
        </div>
      </header>

      <section class="card detection-card" aria-labelledby="detection-heading">
        <div class="card-header">
          <span id="detection-heading" class="section-label">ATS Detection</span>
          <span id="status-badge" class="status-badge status-badge--unsupported">
            Unsupported website
          </span>
        </div>

        <dl class="detection-rows">
          <div class="detection-row">
            <dt>Platform</dt>
            <dd class="detection-value-with-dot">
              <span id="platform-dot" class="status-dot status-dot--unsupported" aria-hidden="true"></span>
              <span id="platform-name">Unknown</span>
            </dd>
          </div>
          <div class="detection-row">
            <dt>Page</dt>
            <dd id="page-type">Not identified</dd>
          </div>
          <div class="detection-row">
            <dt>Status</dt>
            <dd id="support-status">Unsupported website</dd>
          </div>
        </dl>

        <p id="detection-reason" class="detection-reason">
          Checking active browser tab...
        </p>
      </section>

      <section class="actions" aria-label="Extension actions">
        <button
          id="autofill-btn"
          class="btn btn-primary"
          type="button"
          disabled
          title="Enabled on Workday application pages (First Name autofill)"
        >
          Auto-fill
        </button>
        <p id="autofill-note" class="placeholder-note">
          Auto-fill is enabled on Workday application pages (First Name only).
        </p>
        <p
          id="autofill-feedback"
          class="autofill-feedback"
          role="status"
          aria-live="polite"
          hidden
        ></p>

        <button id="settings-btn" class="btn btn-secondary" type="button">
          <svg
            class="btn-icon"
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10 12.75a2.75 2.75 0 1 0 0-5.5 2.75 2.75 0 0 0 0 5.5Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.17 12.16a1.35 1.35 0 0 0 .27 1.49l.05.05a1.64 1.64 0 1 1-2.32 2.32l-.05-.05a1.35 1.35 0 0 0-1.49-.27 1.35 1.35 0 0 0-.82 1.24v.14a1.64 1.64 0 1 1-3.28 0v-.07a1.35 1.35 0 0 0-.88-1.24 1.35 1.35 0 0 0-1.49.27l-.05.05a1.64 1.64 0 1 1-2.32-2.32l.05-.05a1.35 1.35 0 0 0 .27-1.49 1.35 1.35 0 0 0-1.24-.82H2.73a1.64 1.64 0 1 1 0-3.28h.07a1.35 1.35 0 0 0 1.24-.88 1.35 1.35 0 0 0-.27-1.49l-.05-.05a1.64 1.64 0 1 1 2.32-2.32l.05.05a1.35 1.35 0 0 0 1.49.27h.06a1.35 1.35 0 0 0 .82-1.24V2.73a1.64 1.64 0 1 1 3.28 0v.07a1.35 1.35 0 0 0 .82 1.24 1.35 1.35 0 0 0 1.49-.27l.05-.05a1.64 1.64 0 1 1 2.32 2.32l-.05.05a1.35 1.35 0 0 0-.27 1.49v.06a1.35 1.35 0 0 0 1.24.82h.14a1.64 1.64 0 1 1 0 3.28h-.07a1.35 1.35 0 0 0-1.24.82Z"
            />
          </svg>
          <span>Settings</span>
        </button>
      </section>

      <footer class="popup-footer">
        <p>Resume upload &amp; submission remain manual.</p>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
